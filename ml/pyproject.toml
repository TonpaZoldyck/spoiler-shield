[project]
name = "spoiler-shield"
version = "0.1.0"
description = "Training, evaluation and export pipeline for the Spoiler Shield on-device spoiler classifier."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Heavy dependencies for model training and export. Not needed for unit tests.
train = [
    "torch>=2.4",
    "transformers>=4.44",
    "tokenizers>=0.19",
    "onnx>=1.16",
    "onnxruntime>=1.19",
    "onnxscript>=0.1",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.6",
    "pyright>=1.1.380",
]

[project.scripts]
spoiler-shield = "spoiler_shield.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spoiler_shield"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "N", "RUF"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not train'"
markers = [
    "train: needs the heavy 'train' extra (torch, transformers, onnx)",
]
