name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ml:
    name: ML pipeline
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: ml/uv.lock
      - name: Install (with training extras, needed for typechecking and export tests)
        run: uv sync --locked --extra train
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Typecheck
        run: uv run pyright
      - name: Unit tests
        run: uv run pytest
      - name: Export tests (spike model size and ONNX parity)
        run: uv run pytest -m train
      - name: Build spike model for the extension
        run: uv run spoiler-shield spike-model --out ../extension/public/models/spike
      - uses: actions/upload-artifact@v4
        with:
          name: spike-model
          path: extension/public/models/spike
          retention-days: 7

  extension:
    name: Extension
    runs-on: ubuntu-latest
    needs: ml
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: extension/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: extension/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm run typecheck
      - name: Unit tests
        run: pnpm run test
      - uses: actions/download-artifact@v4
        with:
          name: spike-model
          path: extension/public/models/spike
      - name: Build
        run: pnpm run build
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: End-to-end tests
        run: pnpm exec playwright test --project=e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: extension/test-results
          retention-days: 7
